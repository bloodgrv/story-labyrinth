services:
    story-labyrinth:
        image: bloodgrv/story-labyrinth:latest
        container_name: story-labyrinth-app
        # B34 — see docker-compose.yml's own comment: publishing on all interfaces is the
        # intentional default (direct-LAN-access use case), set BIND_HOST=127.0.0.1 in .env for
        # loopback-only.
        ports:
            - "${BIND_HOST:-0.0.0.0}:3000:3000"
        volumes:
            - ./data:/app/data
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DATABASE_PATH=/app/data/story-labyrinth.db
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
