name: Build and Push Docker Image on Release

on:
    release:
        types: [published]

env:
    DOCKER_IMAGE: bloodgrv/story-labyrinth

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract version from release tag
              id: get_version
              run: |
                  VERSION=${GITHUB_REF#refs/tags/}
                  VERSION=${VERSION#v}
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "Release version: ${VERSION}"

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.DOCKER_IMAGE }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=raw,value=latest

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
                  cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
                  platforms: linux/amd64

            - name: Update Docker Hub description
              # Needs DOCKERHUB_TOKEN to have Docker Hub's "Read, Write, Delete" scope — the
              # narrower "Read & Write" scope is enough for docker/login-action's push above but
              # 403s on this action's repository-description PATCH call (a stricter permission
              # tier on Docker Hub's own API, not this action's fault). continue-on-error so a
              # stale/under-scoped token only skips this cosmetic step, not the actual image push.
              continue-on-error: true
              uses: peter-evans/dockerhub-description@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
                  repository: ${{ env.DOCKER_IMAGE }}
                  short-description: "Self-hosted AI writing workspace for long-form fiction: Codex continuity, RAG scanning, WB chats"
                  readme-filepath: ./README.md

            - name: Image digest
              run: |
                  echo "✅ Docker image published successfully!"
                  echo "Version: ${{ steps.get_version.outputs.version }}"
                  echo "Tags: ${{ steps.meta.outputs.tags }}"
