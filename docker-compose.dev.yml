services:
    story-labyrinth:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: story-labyrinth-app
        # B34 — see docker-compose.yml's own comment: publishing on all interfaces is the
        # intentional default (direct-LAN-access use case), set BIND_HOST=127.0.0.1 in .env for
        # loopback-only.
        ports:
            - "${BIND_HOST:-0.0.0.0}:${APP_PORT:-3000}:${APP_PORT:-3000}"
        environment:
            - NODE_ENV=production
            - PORT=${APP_PORT:-3000}
            - DATABASE_PATH=/app/data/story-labyrinth.db
        volumes:
            - ${DATA_PATH:-./data}:/app/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
